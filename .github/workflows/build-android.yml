name: Build Android App (Capacitor)

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build
        working-directory: apps/web

      - name: Add Capacitor Android
        run: npx cap sync android
        working-directory: apps/web

      - name: Update Android SDK Version to 35
        run: |
          sed -i 's/minSdkVersion = 22/minSdkVersion = 23/g' apps/web/android/variables.gradle
          sed -i 's/compileSdkVersion = 34/compileSdkVersion = 35/g' apps/web/android/variables.gradle
          sed -i 's/targetSdkVersion = 34/targetSdkVersion = 35/g' apps/web/android/variables.gradle

      - name: Build Android APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
        working-directory: apps/web/android

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: jemaw-android-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Add APK to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Release
          files: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
