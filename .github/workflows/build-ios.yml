name: Build iOS App (Capacitor)

on:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        working-directory: apps/web

      - name: Add Capacitor iOS
        run: npx cap add ios
        working-directory: apps/web

      - name: Build iOS Project (Unsigned)
        run: xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator
        working-directory: apps/web/ios/App

      - name: Note about IPA
        run: echo "To generate an installable .ipa file, you must configure Apple Developer certificates in GitHub Secrets and run an archive build."
